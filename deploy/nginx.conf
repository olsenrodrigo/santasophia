# Server block do Nginx para santasophiaconsorcios.com.br.
#
# Instalação na VPS:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/santasophia
#   sudo ln -s /etc/nginx/sites-available/santasophia /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# O TLS é emitido pelo certbot DEPOIS de o bloco :80 existir e o DNS apontar
# para a VPS:
#   sudo certbot --nginx -d santasophiaconsorcios.com.br -d www.santasophiaconsorcios.com.br
#
# O certbot reescreve este arquivo adicionando os blocos ssl_certificate e o
# redirecionamento de :80 para :443. Não duplique isso à mão.

# www -> apex. A canônica do site (SITE_URL em client/src/seo/constants.ts) é o
# domínio sem www; servir os dois sem redirect gera conteúdo duplicado.
server {
    listen 80;
    listen [::]:80;
    server_name www.santasophiaconsorcios.com.br;
    return 301 https://santasophiaconsorcios.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name santasophiaconsorcios.com.br;

    # Tamanho máximo do corpo. O formulário de contato é pequeno; o limite
    # baixo corta abuso antes de chegar ao Node.
    client_max_body_size 64k;

    # Compressão. O Express também comprime, mas fazer aqui poupa o Node.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # Cabeçalhos de segurança.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # X-Forwarded-For alimenta o rate-limit da aplicação. Sem ele (e sem
        # TRUST_PROXY=1 no .env) todos os visitantes compartilham um só balde.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_redirect        off;
    }

    # Assets com hash no nome são imutáveis: qualquer mudança gera outro nome.
    location /assets/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
